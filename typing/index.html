<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花咲く言葉 (HSW配列) - タイピングプラクティス v28.01</title>
<style>
  :root {
    --bg-color: #fcfbf9; 
    --text-completed: #333333;
    --text-upcoming: #555555; 
    --text-active-prompt: #769566; 
    --status-text: #b09c85; 
    --border-line: #eaeaea;
    --font-size: 32px;
    --letter-spacing: 0.05em;
  }
  body {
    font-family: "Yu Mincho", "Shippori Mincho", "Noto Serif JP", serif;
    background-color: var(--bg-color);
    color: var(--text-completed);
    max-width: 1000px;
    margin: 0 auto;
    padding: 60px 30px;
    overflow-y: auto;
  }
  
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  h2 {
    color: var(--status-text);
    font-size: 18px;
    font-weight: bold;
    margin: 0;
    letter-spacing: 0.1em;
  }
  .settings-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--status-text);
    transition: color 0.2s;
  }
  .settings-btn:hover { color: var(--text-active-prompt); }

  #mode-indicator {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 40px;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    font-family: sans-serif;
  }
  .mode-hsw {
    background-color: rgba(118, 149, 102, 0.1);
    color: var(--text-active-prompt);
    border: 1px solid var(--text-active-prompt);
  }
  .mode-eng {
    background-color: rgba(225, 29, 72, 0.1);
    color: #e11d48;
    border: 1px solid #e11d48;
  }
  
  #settings-panel {
    display: none;
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 40px;
    border: 1px solid var(--border-line);
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
  }
  select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #fdfdfc;
    color: #333;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-top: 10px;
    outline: none;
    font-family: sans-serif;
  }
  
  .load-btn {
    display: inline-block;
    background-color: var(--text-active-prompt);
    color: #ffffff;
    border: none;
    padding: 10px 16px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.2s;
    font-family: sans-serif;
  }
  .load-btn:hover { background-color: #5c754f; }

  #text-container {
    min-height: 300px;
    margin-bottom: 40px;
  }
  .line-block {
    margin-bottom: 40px;
    transition: margin 0.3s ease;
  }
  .line-block.completed-block { margin-bottom: 5px; }

  #game-board {
    display: none;
    padding: 20px 0;
    text-align: center;
  }
  .game-timer-wrapper {
    width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 40px; overflow: hidden;
  }
  #game-timer-fill {
    width: 100%; height: 100%; background: var(--text-active-prompt); transition: width 0.1s linear;
  }
  #game-play-area {
    min-height: 250px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  #game-visual-wrapper .prompt-layer, #game-visual-wrapper .input-layer {
    font-size: 56px; 
  }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.15); opacity: 0.8; color: var(--text-active-prompt); }
    100% { transform: scale(0.8); opacity: 0; }
  }
  .pop-anim {
    animation: pop 0.15s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }

  .visual-tokens-container {
    display: flex; flex-wrap: wrap; align-items: flex-end; row-gap: 20px;
  }
  .token-wrapper {
    display: inline-flex; 
    flex-direction: column; 
    justify-content: flex-end; 
    align-items: flex-start; 
  }
  .prompt-layer {
    display: flex; align-items: baseline; justify-content: flex-start; margin-top: auto; margin-bottom: 4px; color: var(--text-upcoming); font-size: var(--font-size);
    font-weight: bold; 
  }
  .prompt-layer ruby, .prompt-layer span { line-height: 1.1; }
  .input-layer {
    display: flex; align-items: flex-start; justify-content: flex-start; min-height: 1.5em; font-size: var(--font-size);
  }
  .input-layer span { line-height: 1.1; }

  ruby { ruby-position: over; ruby-align: center; }
  rt { font-size: 0.5em; color: inherit; transform: translateY(-2px); opacity: 0.9; font-weight: bold; }

  .input-space { position: relative; width: 100%; }
  .real-input {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 2; outline: none;
  }

  .state { color: var(--status-text); font-weight: bold; font-family: sans-serif; }
  .mistake { color: #e11d48; font-weight: bold; background: rgba(225,29,72,0.1); border-radius: 4px; padding: 0 2px; }
  .custom-caret {
    display: inline-block; width: 3px; height: 1.1em; background-color: var(--text-active-prompt); animation: blink 1s step-end infinite; margin-left: 2px; transform: translateY(3px);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .status-bar {
    display: flex; justify-content: space-between; padding-top: 25px; padding-bottom: 25px; font-size: 20px; color: var(--status-text); border-top: 1px solid var(--border-line); position: sticky; bottom: 0; background-color: rgba(252, 251, 249, 0.95); z-index: 10; font-family: sans-serif;
  }
  .val { color: var(--text-completed); font-weight: bold; }
</style>
</head>
<body>

<div class="header">
  <h2>✿ 花咲く言葉 - タイピングの庭 v28.01</h2>
  <button class="settings-btn" id="toggle-settings" title="設定・コース選択">⚙️</button>
</div>

<div id="mode-indicator" class="mode-hsw" onclick="toggleInputMode()">
  🌸 現在のモード：HSW配列 (無変換キーで英語へ)
</div>

<div id="settings-panel">
  <label for="course-select" style="color: var(--status-text); font-weight: bold;">練習コースを選択してください：</label>
  <select id="course-select"></select>
  
  <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border-line);">
    <button class="load-btn" onclick="document.getElementById('folder-input').click();">
      📁 フォルダから自作テキスト(.txt)を読み込む
    </button>
    <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;">
  </div>
</div>

<div id="text-container"></div>

<div id="game-board">
   <div style="font-size: 24px; color: var(--status-text); margin-bottom: 20px; font-weight: bold;">
      🍣 単語スプリント (残り <span id="game-time-text" style="color: var(--text-completed);">60.0</span>秒)
   </div>
   <div class="game-timer-wrapper">
      <div id="game-timer-fill"></div>
   </div>
   
   <div id="game-play-area">
      <div class="input-space" id="game-input-space" style="display: flex; justify-content: center;">
         <div tabindex="0" class="real-input" id="game-real-input"></div>
         <div class="visual-wrapper" id="game-visual-wrapper" style="position: relative; z-index:1;"></div>
      </div>
   </div>

   <div style="font-size: 28px; font-weight: bold; color: var(--text-completed); margin-top: 30px;">
      食べた皿: <span id="game-score-val" style="color: var(--text-active-prompt); font-size: 40px; margin-left: 10px;">0</span> 皿
   </div>
</div>

<div class="status-bar">
  <div>進捗: <span id="progress" class="val">0 / 0</span></div>
  <div>時間: <span id="time" class="val">0.0s</span></div>
  <div>CPM: <span id="kpm" class="val">0</span></div>
</div>

<script>
  let customKeyMap = {
    ",": "、", ".": "。", "-": "ー", "?": "？", "!": "！"
  };
  let courseData = {};

  const toggleBtn = document.getElementById('toggle-settings');
  const settingsPanel = document.getElementById('settings-panel');
  const courseSelect = document.getElementById('course-select');
  const textContainer = document.getElementById('text-container');
  const progressSpan = document.getElementById('progress');
  const timeSpan = document.getElementById('time');
  const kpmSpan = document.getElementById('kpm');
  const folderInput = document.getElementById('folder-input');

  let parsedCourse = [];
  let currentIndex = 0;
  let startTime = null;
  let timerInterval = null;
  let totalChars = 0;
  
  let isGameMode = false;
  let gameTimer = 60.0;
  let gameScore = 0;
  let gameInterval = null;
  let gameWordsPool = [];
  let currentWordObj = null;

  let isEnglishMode = false;
  let normalInputValue = "";
  let gameInputValue = "";

  function setInputMode(isEnglish) {
      if (isEnglishMode === isEnglish) return;
      isEnglishMode = isEnglish;
      const indicator = document.getElementById('mode-indicator');
      if (isEnglish) {
          indicator.className = 'mode-eng';
          indicator.innerHTML = '🔤 現在のモード：英語直接入力 (変換キーで日本語へ)';
      } else {
          indicator.className = 'mode-hsw';
          indicator.innerHTML = '🌸 現在のモード：HSW配列 (無変換キーで英語へ)';
      }
  }

  window.toggleInputMode = function() {
      setInputMode(!isEnglishMode);
      const activeInput = document.querySelector('.real-input:focus') || document.querySelector('.real-input') || document.getElementById('game-real-input');
      if (activeInput) activeInput.focus();
  };

  // 無変換キーが物理的に ShiftRight として送られてくる環境向け：
  // 「単独タップ」だけを英語モード切替のトリガーにする（他キーとの同時押しは通常のShiftとして無視）
  let shiftRightDownTime = 0;
  let shiftRightModifierUsed = false;

  function handleShiftTapDown(e) {
      if (e.code === 'ShiftRight') {
          shiftRightDownTime = performance.now();
          shiftRightModifierUsed = false;
      } else if (e.shiftKey) {
          // Shiftを押しながら他のキーを押した＝通常のモディファイア用途
          shiftRightModifierUsed = true;
      }
  }

  function handleShiftTapUp(e) {
      if (e.code === 'ShiftRight') {
          const heldTime = performance.now() - shiftRightDownTime;
          if (!shiftRightModifierUsed && heldTime < 40) {
              setInputMode(true);
          }
      }
  }

  function checkModeSwitchKeys(e) {
      if (e.code === 'NonConvert' || e.key === 'NonConvert' || e.keyCode === 29) {
          e.preventDefault();
          setInputMode(true);
          return true;
      }
      if (e.code === 'Convert' || e.key === 'Convert' || e.keyCode === 28) {
          e.preventDefault();
          setInputMode(false);
          return true;
      }
      return false;
  }

  // =========================================================
  // 🚀 強化版：パス自動探索 ＆ エラー詳細出力機能
  // =========================================================
  async function initApp() {
    try {
      // 考えられるすべてのファイル位置を定義して、順番に探す
      const pathCandidates = [
        { r: 'data/romantable.txt', c: 'data/course.json' },         // パターンB: typing/data/ にある場合
        { r: '../data/romantable.txt', c: '../data/course.json' },   // パターンA: 1つ上の階層にある場合
        { r: '/hana-saku-words/data/romantable.txt', c: '/hana-saku-words/data/course.json' } // 絶対パス
      ];

      let romanRes = null, courseRes = null;
      let isFound = false;

      for (let paths of pathCandidates) {
        try {
          let r = await fetch(paths.r);
          let c = await fetch(paths.c);
          if (r.ok && c.ok) {
            romanRes = r;
            courseRes = c;
            isFound = true;
            console.log("✅ データを次のパスから読み込みました: " + paths.r);
            break; // 成功したらループを抜ける
          }
        } catch (e) {
          // fetchエラー（CORS等）は無視して次のパスを試す
        }
      }

      if (!isFound) {
        throw new Error("ファイルが見つかりません(404エラー)。\n\n【よくある原因】\n① JSONファイルの名前が「course.json.txt」になっている (Windowsの拡張子非表示による罠)\n② フォルダ名が大文字の「Data」になっている");
      }

      // ローマ字テーブルのパース
      const romanText = await romanRes.text();
      romanText.split('\n').forEach(line => {
        line = line.trim();
        if (!line) return;
        const parts = line.split(/[\t ]+/);
        if (parts.length >= 2) {
          const key = parts[0];
          const val = parts[parts.length - 1];
          if (key && val) customKeyMap[key] = val;
        }
      });

      // コースデータのパース（JSONエラーの特定）
      try {
        courseData = await courseRes.json();
      } catch (jsonError) {
        throw new Error("course.json の書き方に文法エラーがあります。\n最後の項目の末尾に余計なカンマ(,)がないか、または記号が抜けていないか確認してください。\n詳細: " + jsonError.message);
      }

      // すべて成功したらUIを構築
      buildDropdown();
      if (courseSelect.options.length > 0) loadCourse(courseSelect.options[0].value);
      
    } catch (error) {
      console.error(error);
      alert("⚠️ データ読み込みエラー\n\n" + error.message);
    }
  }

  function parseAozora(line) {
    const regex = /(?:[｜|]([^《]+)《([^》]+)》)|([\u4E00-\u9FFF\u3005\u3007]+)《([^》]+)》/g;
    let tokens = [];
    let lastIndex = 0;
    let match;
    
    while ((match = regex.exec(line)) !== null) {
      if (match.index > lastIndex) {
        const preText = line.substring(lastIndex, match.index);
        for (const char of preText) tokens.push({ type: 'char', char: char, target: char });
      }
      const base = match[1] || match[3];
      const ruby = match[2] || match[4];
      tokens.push({ type: 'ruby', base: base, ruby: ruby, target: ruby });
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < line.length) {
      const postText = line.substring(lastIndex);
      for (const char of postText) tokens.push({ type: 'char', char: char, target: char });
    }
    return tokens;
  }

  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildDropdown() {
    courseSelect.innerHTML = '';
    for (const courseName in courseData) {
      const option = document.createElement('option');
      option.value = courseName;
      option.textContent = courseName;
      courseSelect.appendChild(option);
    }
  }

  function zenkakuToHankaku(str) {
      if (!str) return "";
      return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
          return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      });
  }

  const kataToHira = (str) => {
    if (!str) return "";
    return str.replace(/[\u30A1-\u30F6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60));
  };
  
  const hiraToKata = (str) => {
    if (!str) return "";
    return str.replace(/[\u3041-\u3096]/g, match => String.fromCharCode(match.charCodeAt(0) + 0x60));
  };

  function normalizeForMatch(str) {
      return zenkakuToHankaku(kataToHira(str)).toLowerCase();
  }

  function isBridgeChar(char, targetChar) {
    if (!char || !targetChar) return false;
    for (const key in customKeyMap) {
      if (key.length === char.length + 1 && key.charAt(0) === char && customKeyMap[key] === targetChar) {
        return true;
      }
    }
    return false;
  }

  function applyCustomIME(inputStr) {
    let result = "";
    for (let i = 0; i < inputStr.length; i++) {
      result += inputStr[i];
      for (let len = 6; len >= 1; len--) {
        if (result.length >= len) {
          let suffix = result.slice(-len);
          if (customKeyMap[suffix]) {
            result = result.slice(0, -len) + customKeyMap[suffix];
            break;
          }
        }
      }
    }
    return result;
  }

  function startTimer() {
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      timeSpan.textContent = elapsed.toFixed(1) + 's';
      if (elapsed > 0) kpmSpan.textContent = Math.round(totalChars / (elapsed / 60));
    }, 100);
  }

  folderInput.addEventListener('change', async (e) => {
    const files = e.target.files;
    let addedCount = 0;
    for (const file of files) {
      if (file.name.endsWith('.txt')) {
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length > 0) {
          courseData[file.name] = lines;
          addedCount++;
        }
      }
    }
    if (addedCount > 0) {
      buildDropdown();
      alert(`${addedCount} 件のテキストファイルを読み込みました！`);
      courseSelect.selectedIndex = courseSelect.options.length - 1;
      loadCourse(courseSelect.value);
      settingsPanel.style.display = 'none';
    }
  });

  toggleBtn.addEventListener('click', () => {
    settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
  });

  courseSelect.addEventListener('change', () => {
    loadCourse(courseSelect.value);
    settingsPanel.style.display = 'none';
  });

  function loadCourse(courseName) {
    const rawLines = courseData[courseName];
    parsedCourse = rawLines.map(line => {
      const tokens = parseAozora(line);
      const targetLine = tokens.map(t => t.target).join('');
      const targetLineHira = normalizeForMatch(targetLine);
      return { rawLine: line, tokens, targetLine, targetLineHira };
    });

    if (courseName.includes("ゲーム")) {
      isGameMode = true;
      document.getElementById('text-container').style.display = 'none';
      document.getElementById('game-board').style.display = 'block';
      startGame(parsedCourse);
    } else {
      isGameMode = false;
      document.getElementById('text-container').style.display = 'block';
      document.getElementById('game-board').style.display = 'none';
      
      currentIndex = 0;
      totalChars = 0;
      startTime = null;
      clearInterval(timerInterval);
      clearInterval(gameInterval);
      
      timeSpan.textContent = '0.0s';
      kpmSpan.textContent = '0';
      
      textContainer.innerHTML = '';
      parsedCourse.forEach((parsed, index) => {
        const blockDiv = document.createElement('div');
        blockDiv.className = 'line-block';
        blockDiv.id = `block-${index}`;
        
        const inputDiv = document.createElement('div');
        inputDiv.className = 'input-space';
        
        blockDiv.appendChild(inputDiv);
        textContainer.appendChild(blockDiv);
      });
      
      renderLines();
    }
  }

  function startGame(wordsArray) {
    gameWordsPool = [...wordsArray].sort(() => Math.random() - 0.5);
    gameScore = 0;
    gameTimer = 60.0;
    totalChars = 0;
    startTime = Date.now();
    
    document.getElementById('game-score-val').innerText = gameScore;
    document.getElementById('game-time-text').innerText = gameTimer.toFixed(1);
    
    const inputField = document.getElementById('game-real-input');
    inputField.style.display = 'block';
    
    clearInterval(timerInterval);
    clearInterval(gameInterval);
    gameInterval = setInterval(() => {
      let elapsed = (Date.now() - startTime) / 1000;
      gameTimer = Math.max(0, 60.0 - elapsed);
      
      document.getElementById('game-time-text').innerText = gameTimer.toFixed(1);
      document.getElementById('game-timer-fill').style.width = (gameTimer / 60 * 100) + '%';
      
      timeSpan.textContent = elapsed.toFixed(1) + 's';
      if(elapsed > 0) kpmSpan.textContent = Math.round(totalChars / (elapsed / 60));

      if (gameTimer <= 0) {
          endGame();
      }
    }, 100);

    nextGameWord();
  }

  function nextGameWord() {
    if (gameWordsPool.length === 0) {
        gameWordsPool = [...parsedCourse].sort(() => Math.random() - 0.5);
    }
    currentWordObj = gameWordsPool.pop();
    gameInputValue = '';
    
    const visualWrapper = document.getElementById('game-visual-wrapper');
    visualWrapper.classList.remove('pop-anim');
    void visualWrapper.offsetWidth; 
    
    updateGameVisuals('');
    document.getElementById('game-real-input').focus();
  }

  function updateGameVisuals(val, rawVal) {
    if(!currentWordObj) return;
    if (rawVal === undefined) rawVal = val;

    let matchVal = normalizeForMatch(val);
    let matchTarget = normalizeForMatch(currentWordObj.targetLineHira);

    let matchLen = 0;
    for (let i = 0; i < matchVal.length; i++) {
        if (/[ァ-ヶ]/.test(rawVal[i]) && rawVal[i] !== 'ー') {
            break;
        }
        if (matchVal[i] === matchTarget[i]) matchLen++;
        else break;
    }

    let remainingVal = val;
    let currentMatch = matchLen;
    let caretDrawn = false;
    let html = '<div class="visual-tokens-container" style="justify-content: center;">';

    for (const token of currentWordObj.tokens) {
        html += '<div class="token-wrapper">';
        let pLayer = '';
        let iLayer = '';

        if (currentMatch >= token.target.length) {
            pLayer = `<span style="visibility:hidden; user-select:none;">${token.type === 'ruby' ? token.base : token.char}</span>`;
            iLayer = `<span style="color: var(--text-completed); font-weight: bold;">${token.type === 'ruby' ? token.base : token.char}</span>`;
            currentMatch -= token.target.length;
            remainingVal = remainingVal.substring(token.target.length);
        } else if (!caretDrawn) {
            caretDrawn = true;
            if (token.type === 'ruby') {
              const hiddenRuby = token.ruby.substring(0, currentMatch);
              const remainingRuby = token.ruby.substring(currentMatch);
              const activeRuby = remainingRuby.substring(0, 1);
              const futureRuby = remainingRuby.substring(1);
              pLayer = `<ruby><span style="opacity: 0.8; color: var(--text-completed); font-weight:bold;">${token.base}</span><rt><span style="visibility:hidden">${hiddenRuby}</span><span style="color: var(--text-active-prompt); font-weight:bold;">${activeRuby}</span><span style="color: var(--text-upcoming);">${futureRuby}</span></rt></ruby>`;
            } else {
              const hiddenChar = token.char.substring(0, currentMatch);
              const remainingChar = token.char.substring(currentMatch);
              const activeChar = remainingChar.substring(0, 1);
              const futureChar = remainingChar.substring(1);
              pLayer = `<span style="visibility:hidden">${hiddenChar}</span><span style="opacity: 1; color: var(--text-active-prompt); font-weight:bold;">${activeChar}</span><span style="color: var(--text-upcoming); font-weight:bold;">${futureChar}</span>`;
            }

            let typedText = "";
            let confirmedStr = remainingVal.substring(0, currentMatch);
            for (let j = 0; j < confirmedStr.length; j++) {
                let char = confirmedStr[j];
                let targetChar = currentWordObj.targetLine[matchLen - currentMatch + j];
                if (targetChar && hiraToKata(char) === targetChar) char = targetChar;
                if (targetChar && char.toLowerCase() === targetChar.toLowerCase()) char = targetChar;
                typedText += char;
            }
            typedText = `<span style="color: var(--text-completed); font-weight: bold;">${escapeHTML(typedText)}</span>`;
            
            let extra = remainingVal.substring(currentMatch);
            for (let j = 0; j < extra.length; j++) {
              let char = extra[j];
              let targetChar = currentWordObj.targetLine[matchLen + j];
              if (targetChar && hiraToKata(char) === targetChar) char = targetChar;
              if (targetChar && char.toLowerCase() === targetChar.toLowerCase()) char = targetChar;
              
              if (/[ァ-ヶA-Za-z0-9ー]/.test(char) || isBridgeChar(char, targetChar)) {
                typedText += `<span class="state">${escapeHTML(char)}</span>`;
              } else {
                typedText += `<span class="mistake">${escapeHTML(char)}</span>`;
              }
            }
            
            if(typedText === "") typedText = `<span style="visibility:hidden;">_</span>`;

            iLayer = `<div style="display: flex; align-items: center;">${typedText}<span class="custom-caret"></span></div>`;
            remainingVal = "";
            currentMatch = 0;
        } else {
            if (token.type === 'ruby') {
              pLayer = `<ruby>${token.base}<rt>${token.ruby}</rt></ruby>`;
            } else {
              pLayer = `<span>${token.char}</span>`;
            }
            iLayer = `<span style="visibility:hidden;">_</span>`;
        }

        html += `<div class="prompt-layer">${pLayer}</div>`;
        html += `<div class="input-layer">${iLayer}</div>`;
        html += '</div>'; 
    }
    html += '</div>';
    
    document.getElementById('game-visual-wrapper').innerHTML = html;
  }

  const gameInputEl = document.getElementById('game-real-input');

  gameInputEl.addEventListener('keydown', function(e) {
    if(gameTimer <= 0) return;
    handleShiftTapDown(e);
    if (checkModeSwitchKeys(e)) return;

    if (e.code === 'CapsLock' || e.key === 'Alphanumeric' || e.code === 'Lang2' || e.key === 'Backspace') {
      e.preventDefault();
      gameInputValue = gameInputValue.slice(0, -1);
      handleGameInputUpdate();
      return;
    }

    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      gameInputValue += e.key;
      handleGameInputUpdate();
    }
  });

  gameInputEl.addEventListener('keyup', function(e) {
    if(gameTimer <= 0) return;
    checkModeSwitchKeys(e);
    handleShiftTapUp(e);
  });

  function handleGameInputUpdate() {
    let val = gameInputValue;
    if (!isEnglishMode) {
      val = applyCustomIME(val);
    }
    gameInputValue = val;

    let adjustedVal = "";
    for (let i = 0; i < val.length; i++) {
        let typedChar = val[i];
        let targetChar = currentWordObj.targetLine[i]; 
        if (targetChar && hiraToKata(typedChar) === targetChar) {
          typedChar = targetChar;
        }
        adjustedVal += typedChar;
    }

    updateGameVisuals(adjustedVal, val);

    let matchVal = normalizeForMatch(val);
    let matchTarget = normalizeForMatch(currentWordObj.targetLineHira);

    let hasState = false;
    for(let c of val) {
       if(/[ァ-ヶ]/.test(c) && c !== 'ー') hasState = true;
    }

    if (matchVal === matchTarget && matchTarget.length > 0 && !hasState) {
        totalChars += currentWordObj.targetLine.length;
        gameScore++;
        document.getElementById('game-score-val').innerText = gameScore;
        
        const visualWrapper = document.getElementById('game-visual-wrapper');
        visualWrapper.classList.add('pop-anim');
        
        setTimeout(() => {
            nextGameWord();
        }, 150); 
    }
  }

  window.restartGame = function() {
    startGame(parsedCourse);
  };

  function endGame() {
    clearInterval(gameInterval);
    document.getElementById('game-time-text').innerText = "0.0";
    
    const inputField = document.getElementById('game-real-input');
    inputField.style.display = 'none'; 

    const visualWrapper = document.getElementById('game-visual-wrapper');
    visualWrapper.classList.remove('pop-anim');
    visualWrapper.innerHTML = `
        <div style="text-align:center;">
            <div style="font-size: 40px; color: var(--text-active-prompt); margin-bottom:20px; font-weight: bold;">終了！</div>
            <div style="font-size: 24px; color: var(--text-completed);">
                食べた皿: <strong style="font-size: 32px; color: var(--status-text);">${gameScore}</strong> 皿<br>
                入力文字数: <strong style="font-size: 32px; color: var(--status-text);">${totalChars}</strong> 文字
            </div>
            <button onclick="restartGame()" class="load-btn" style="font-size: 20px; padding: 15px 30px; margin-top: 30px; position:relative; z-index:100;">もう一度プレイ</button>
        </div>
    `;
  }

  function renderLines() {
    if (currentIndex >= parsedCourse.length) {
      clearInterval(timerInterval);
      const clearMsg = document.createElement('div');
      clearMsg.style.fontSize = '24px';
      clearMsg.style.marginTop = '40px';
      clearMsg.style.textAlign = 'center';
      clearMsg.style.color = 'var(--text-active-prompt)';
      clearMsg.innerHTML = '✿ 満開になりました。お疲れ様でした！';
      textContainer.appendChild(clearMsg);
      updateStatus();
      return;
    }

    parsedCourse.forEach((parsed, index) => {
      const blockDiv = document.getElementById(`block-${index}`);
      const inputDiv = blockDiv.querySelector('.input-space');

      if (index < currentIndex) {
        blockDiv.className = 'line-block completed-block';
        let completedHtml = '<div style="font-size: var(--font-size); color: var(--text-completed); font-weight: bold; line-height: 1.8; margin-top: 10px;">';
        parsed.tokens.forEach(token => {
            completedHtml += `<span>${token.type === 'ruby' ? token.base : token.char}</span>`;
        });
        completedHtml += '</div>';
        inputDiv.innerHTML = completedHtml; 
      } 
      else if (index === currentIndex) {
        blockDiv.className = 'line-block';

        if (!inputDiv.querySelector('.real-input')) {
          inputDiv.innerHTML = `
            <div tabindex="0" class="real-input"></div>
            <div class="visual-wrapper" style="position: relative; z-index:1;"></div>
          `;
          const inputField = inputDiv.querySelector('.real-input');
          const visualDiv = inputDiv.querySelector('.visual-wrapper');
          
          normalInputValue = ""; 
          inputField.focus();

          const updateVisuals = (val, rawVal) => {
            if (rawVal === undefined) rawVal = val;

            let matchVal = normalizeForMatch(val);
            let matchTarget = normalizeForMatch(parsed.targetLineHira);

            let matchLen = 0;
            for (let i = 0; i < matchVal.length; i++) {
                if (/[ァ-ヶ]/.test(rawVal[i]) && rawVal[i] !== 'ー') break;
                if (matchVal[i] === matchTarget[i]) matchLen++;
                else break;
            }

            let remainingVal = val;
            let currentMatch = matchLen;
            let caretDrawn = false;

            let html = '<div class="visual-tokens-container">';

            for (const token of parsed.tokens) {
              html += '<div class="token-wrapper">';
              
              let pLayer = '';
              let iLayer = '';

              if (currentMatch >= token.target.length) {
                pLayer = `<ruby style="visibility:hidden; user-select:none;">${token.type === 'ruby' ? token.base : token.char}<rt>_</rt></ruby>`;
                iLayer = `<span style="color: var(--text-completed); font-weight: bold;">${token.type === 'ruby' ? token.base : token.char}</span>`;
                currentMatch -= token.target.length;
                remainingVal = remainingVal.substring(token.target.length);
              } else if (!caretDrawn) {
                caretDrawn = true;
                
                if (token.type === 'ruby') {
                  const hiddenRuby = token.ruby.substring(0, currentMatch);
                  const remainingRuby = token.ruby.substring(currentMatch);
                  const activeRuby = remainingRuby.substring(0, 1);
                  const futureRuby = remainingRuby.substring(1);
                  pLayer = `<ruby><span style="opacity: 0.8; color: var(--text-completed); font-weight:bold;">${token.base}</span><rt><span style="visibility:hidden">${hiddenRuby}</span><span style="color: var(--text-active-prompt); font-weight:bold;">${activeRuby}</span><span style="color: var(--text-upcoming);">${futureRuby}</span></rt></ruby>`;
                } else {
                  const hiddenChar = token.char.substring(0, currentMatch);
                  const remainingChar = token.char.substring(currentMatch);
                  const activeChar = remainingChar.substring(0, 1);
                  const futureChar = remainingChar.substring(1);
                  pLayer = `<ruby><span style="visibility:hidden">${hiddenChar}</span><span style="opacity: 1; color: var(--text-active-prompt); font-weight:bold;">${activeChar}</span><span style="color: var(--text-upcoming); font-weight:bold;">${futureChar}</span><rt style="visibility:hidden">_</rt></ruby>`;
                }

                let typedText = "";
                let confirmedStr = remainingVal.substring(0, currentMatch);
                for (let j = 0; j < confirmedStr.length; j++) {
                    let char = confirmedStr[j];
                    let targetChar = parsed.targetLine[matchLen - currentMatch + j];
                    if (targetChar && hiraToKata(char) === targetChar) char = targetChar;
                    if (targetChar && char.toLowerCase() === targetChar.toLowerCase()) char = targetChar;
                    typedText += char;
                }
                typedText = `<span style="color: var(--text-completed); font-weight: bold;">${escapeHTML(typedText)}</span>`;
                
                let extra = remainingVal.substring(currentMatch);
                for (let j = 0; j < extra.length; j++) {
                  let char = extra[j];
                  let targetChar = parsed.targetLine[matchLen + j];
                  if (targetChar && hiraToKata(char) === targetChar) char = targetChar;
                  if (targetChar && char.toLowerCase() === targetChar.toLowerCase()) char = targetChar;
                  
                  if (/[ァ-ヶA-Za-z0-9ー]/.test(char) || isBridgeChar(char, targetChar)) {
                    typedText += `<span class="state">${escapeHTML(char)}</span>`;
                  } else {
                    typedText += `<span class="mistake">${escapeHTML(char)}</span>`;
                  }
                }
                
                if(typedText === "") typedText = `<span style="visibility:hidden;">_</span>`;

                iLayer = `<div style="display: flex; align-items: center;">${typedText}<span class="custom-caret"></span></div>`;
                remainingVal = "";
                currentMatch = 0;
              } else {
                if (token.type === 'ruby') {
                  pLayer = `<ruby>${token.base}<rt>${token.ruby}</rt></ruby>`;
                } else {
                  pLayer = `<ruby>${token.char}<rt style="visibility:hidden">_</rt></ruby>`;
                }
                iLayer = `<span style="visibility:hidden;">_</span>`;
              }

              html += `<div class="prompt-layer">${pLayer}</div>`;
              html += `<div class="input-layer">${iLayer}</div>`;
              html += '</div>'; 
            }

            html += '</div>'; 
            visualDiv.innerHTML = html;
          };

          const checkInput = () => {
            if (!startTime) startTimer();
            
            let val = normalInputValue;
            if (!isEnglishMode) {
              val = applyCustomIME(val);
            }
            normalInputValue = val;

            let adjustedVal = "";
            for (let i = 0; i < val.length; i++) {
              let typedChar = val[i];
              let targetChar = parsed.targetLine[i]; 
              if (targetChar && hiraToKata(typedChar) === targetChar) {
                typedChar = targetChar;
              }
              adjustedVal += typedChar;
            }

            updateVisuals(adjustedVal, val); 

            let matchVal = normalizeForMatch(val);
            let matchTarget = normalizeForMatch(parsed.targetLineHira);

            let hasState = false;
            for(let c of val) {
               if(/[ァ-ヶ]/.test(c) && c !== 'ー') hasState = true;
            }

            if (matchVal === matchTarget && matchTarget.length > 0 && !hasState) {
              totalChars += parsed.targetLine.length;
              currentIndex++;
              renderLines();
              
              const nextBlock = document.getElementById(`block-${currentIndex}`);
              if (nextBlock) {
                 nextBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }
          };

          inputField.addEventListener('keydown', (e) => {
            handleShiftTapDown(e);
            if (checkModeSwitchKeys(e)) return;

            if (e.code === 'CapsLock' || e.key === 'Alphanumeric' || e.code === 'Lang2' || e.key === 'Backspace') {
              e.preventDefault();
              normalInputValue = normalInputValue.slice(0, -1);
              checkInput();
              return;
            }

            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
              e.preventDefault();
              normalInputValue += e.key;
              checkInput();
            }
          });

          inputField.addEventListener('keyup', (e) => {
            checkModeSwitchKeys(e);
            handleShiftTapUp(e);
          });

          updateVisuals(normalInputValue, normalInputValue); 

        } else {
          inputDiv.querySelector('.real-input').focus();
        }
      } 
      else {
        blockDiv.className = 'line-block';
        let futureHtml = '<div class="visual-tokens-container">';
        parsed.tokens.forEach(token => {
            futureHtml += '<div class="token-wrapper">';
            let pLayer = '';
            if(token.type === 'ruby') {
                pLayer = `<ruby>${token.base}<rt>${token.ruby}</rt></ruby>`;
            } else {
                pLayer = `<ruby>${token.char}<rt style="visibility:hidden">_</rt></ruby>`;
            }
            futureHtml += `<div class="prompt-layer">${pLayer}</div>`;
            futureHtml += `<div class="input-layer"><span style="visibility:hidden;">_</span></div>`;
            futureHtml += '</div>';
        });
        futureHtml += '</div>';
        inputDiv.innerHTML = futureHtml;
      }
    });

    updateStatus();
  }

  function updateStatus() {
    if(parsedCourse && parsedCourse.length > 0) {
        progressSpan.textContent = `${currentIndex} / ${parsedCourse.length}`;
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('#toggle-settings') || e.target.closest('#settings-panel') || e.target.closest('.load-btn') || e.target.closest('#mode-indicator')) return;
    
    if (isGameMode) {
       const gameInput = document.getElementById('game-real-input');
       if(gameInput && gameInput.style.display !== 'none') gameInput.focus();
    } else {
       const activeInput = document.querySelector('#text-container .real-input');
       if (activeInput) activeInput.focus();
    }
  });

  initApp();

</script>

</body>
